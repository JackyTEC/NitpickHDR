name: Build & Release

# - Every push / PR: build the exe and attach it to the workflow run (Actions tab).
# - Pushing a tag like v1.2.3: also publish a GitHub Release with the zip + exe.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Configure
        run: cmake -B build -A x64 -DNITPICK_VERSION=${{ steps.ver.outputs.version }}

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p dist/NitpickHDR
          cp build/Release/NitpickHDR.exe README.md LICENSE dist/NitpickHDR/
          cp build/Release/NitpickHDR.exe dist/NitpickHDR-$V.exe
          (cd dist && 7z a -bd "NitpickHDR-$V-win64.zip" NitpickHDR > /dev/null)
          (cd dist && sha256sum "NitpickHDR-$V-win64.zip" "NitpickHDR-$V.exe" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NitpickHDR-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Nitpick ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
